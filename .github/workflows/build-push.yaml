name: Build And Push

# Builds this repo's one capability image -- k8s-discovery (stateless) --
# and pushes a multi-arch manifest to GHCR.
#
# `test` runs rwdiscovery's own pytest/ruff suite and gates the image: a
# broken task host never reaches an image push.
#
# `image` calls runwhen-capability's reusable capability-image workflow. It
# computes the tags, checks the manifest, bakes in the
# com.runwhen.capability.manifest.v1 / schemas.v1 labels from `rwtask
# label`, builds natively on amd64 and arm64, smoke-tests the image and
# pushes. Tags:
#
#     <sanitized-ref>-<sha7>   every branch build (plus <ref>, and latest on main)
#     pr-<n>-<sha7>            pull requests (plus pr-<n>)
#
# Keep the workflow's tag (@v...) and the runwhen-capability pins in
# pyproject.toml and Dockerfile.k8s-discovery on the same release.
#
# Build triggers:
#   - push to ANY branch  -> an image for that branch, a version the catalog can pin
#   - pull_request to ANY base branch -> a "pr-<n>" preview image (a fork's PR builds
#                                        and smoke-tests, but does not push)
#   - workflow_dispatch  -> manual build
#
# Path filters below skip rebuilds for pure docs / config-only diffs.

on:
  push:
    branches:
      - '**'            # all branches; tag pushes (refs/tags/*) are excluded
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - 'docs/**'
  pull_request:
    # No branches: restriction -> triggers on PRs targeting any base branch
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      push:
        description: "Push the resulting image to GHCR."
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  # ===========================================================================
  # test — rwdiscovery's own suite. `image` depends on it so a broken task
  # host never reaches an image push.
  # ===========================================================================
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python3 -m pip install --quiet -e ".[dev]"

      - name: Verify checked-in schemas match the models
        run: rwtask schemas --check

      - name: pytest
        run: python3 -m pytest -q

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

  # ===========================================================================
  # image -- the shared capability-image workflow, for k8s-discovery.
  # ===========================================================================
  image:
    needs: test
    permissions:
      contents: read
      packages: write
    uses: runwhen-contrib/runwhen-capability/.github/workflows/capability-image.yml@v0.1.0
    with:
      capability: k8s-discovery
      dockerfile: Dockerfile.k8s-discovery
      image-name: rw-discovery-codecollection
      execution-mode: stateless
      push: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
      smoke-command: |
        # discover registers the pack first thing; prove the image can load it.
        docker run --rm "${IMG}" python -c "from rwdiscovery.packbuild import build_pack_payload; p = build_pack_payload([]); assert p['types'] and p['dependencyRules'], p.keys()"

        # kubectl ships for the `cli` task only (platform-contract §7), pinned and
        # sha256-verified in the Dockerfile; discover and inspect still talk to the
        # API over HTTP. Assert the image carries exactly the pinned version.
        want=$(sed -n 's/^ARG KUBECTL_VERSION=//p' Dockerfile.k8s-discovery)
        got=$(docker run --rm "${IMG}" kubectl version --client -o json \
          | python3 -c 'import json,sys; print(json.load(sys.stdin)["clientVersion"]["gitVersion"])')
        if [ -z "${want}" ] || [ "${got}" != "${want}" ]; then
          echo "k8s-discovery image ships kubectl '${got}', expected the pinned '${want}'" >&2
          exit 1
        fi
