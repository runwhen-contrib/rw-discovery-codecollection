# Capability manifest for k8s-discovery -- shape defined by the RunWhen
# capability manifest format and this repo's own platform-contract §5 (the
# tasks this capability exposes). If this needs to diverge from either,
# raise it there first.
#
# `image` below is a build-time placeholder. CI resolves the digest of the
# image it just pushed and rewrites this field to
# ghcr.io/runwhen-contrib/rw-discovery-codecollection@sha256:<actual digest>
# before the manifest is picked up by the catalog. Do not hand-edit the
# placeholder; do not ship it as-is.
apiVersion: capability/v1
capability: k8s-discovery
version: "0.1.0"
description: Kubernetes cluster discovery -- enumerate, sanitize and sync resources to the platform's resource inventory
image: ghcr.io/runwhen-contrib/rw-discovery-codecollection@sha256:INJECTED_BY_CI

# --- generic scheduling knobs; papi forwards these to the runner verbatim -------------
execution:
  mode: stateless
  maxPodsPerPool: 2
  maxConcurrentPerPod: 4          # inspect calls are small; discover is one long request
  idleTtlSeconds: 900
  requestTimeoutSeconds: 1500     # discover's ceiling for a large cluster; inspect finishes in seconds
  resources: {memoryRequest: 256Mi, memoryLimit: 1Gi, cpuRequest: 100m, cpuLimit: "1"}

# --- which subjects this capability applies to; ANY entry matching => applies ----------
appliesTo:
  - platform: kubernetes
    type: cluster

# --- what the platform must supply ----------------------------------------------------
needs:
  credentials:
    - name: kubeconfig             # the local name a task reads it by
      kind: k8s.kubeconfig         # platform-contract §4
      access: read
    - name: resourceSync           # the local name a task reads it by
      kind: runwhen.resourceSync   # platform-contract §4 -- lease-scoped, minted per run
      access: write

# --- runs once per request, before any task --------------------------------------------
setup:
  task: connect                    # materialise the kubeconfig, check access, read server version + kube-system UID
  outputs:
    serverVersion: { type: string }
    clusterUid:    { type: string }

# --- the tasks themselves ---------------------------------------------------------------
tasks:
  - name: discover
    description: Enumerate, sanitize and push this cluster's resources to the platform's resource inventory
    readOnly: false
    inputs:
      clusterName:       { from: request }
      namespaces:        { from: request, optional: true }
      excludeNamespaces: { from: request, optional: true }
      configMapValues:   { from: request, optional: true }
      overlay:           { from: request, optional: true }
    outputs:
      summary:
        kind: rw.discovery_summary.v1
        schema: ./schemas/discovery_summary.json

  - name: inspect
    description: Get, describe or tail the logs of one Kubernetes object, read-only, no shell
    readOnly: true
    inputs:
      clusterName:  { from: request }
      kind:         { from: request }
      name:         { from: request }
      namespace:    { from: request, optional: true }
      apiVersion:   { from: request, optional: true }
      mode:         { from: request }               # "get" | "describe" | "logs"
      container:    { from: request, optional: true }   # mode "logs" only
      previous:     { from: request, optional: true }   # mode "logs" only
      sinceSeconds: { from: request, optional: true }   # mode "logs" only -- default 900, max 86400
      tailLines:    { from: request, optional: true }   # mode "logs" only -- default 200, max 2000
      grep:         { from: request, optional: true }   # mode "logs" only -- Python regex, case-insensitive
      maxPods:      { from: request, optional: true }   # mode "logs" only -- default 3, max 10
    outputs:
      object:
        kind: rw.k8s_object.v1
        schema: ./schemas/k8s_object.json

retention:
  pod: on_failure                  # all | on_failure | none
  result: 30d
