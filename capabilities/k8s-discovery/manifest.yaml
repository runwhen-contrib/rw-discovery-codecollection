# Capability manifest for k8s-discovery -- shape defined by the RunWhen
# capability manifest format and this repo's own platform-contract §5 (the
# tasks this capability exposes). If this needs to diverge from either,
# raise it there first.
#
# There is no `image` key here: an image cannot know its own digest. This
# manifest instead rides the image itself, as the OCI label
# com.runwhen.capability.manifest.v1 (base64 of this file, verbatim) --
# scripts/manifest_label.py produces that value at build time, and
# codecollection-registry's catalog reads it straight off the pushed image.
# See rw-checks-codecollection's capabilities/rw-checks/manifest.yaml for
# the same convention this mirrors.
apiVersion: capability/v1
capability: k8s-discovery
version: "0.1.0"
description: Kubernetes cluster discovery -- enumerate, sanitize and sync resources to the platform's resource inventory

# --- generic scheduling knobs; papi forwards these to the runner verbatim -------------
execution:
  mode: stateless
  serviceAccountToken: true       # in-cluster discovery authenticates as the pod's own ServiceAccount; the token is only mounted for capabilities that declare this
  maxPodsPerPool: 2
  maxConcurrentPerPod: 4          # cli calls are small; discover is one long request
  idleTtlSeconds: 900
  requestTimeoutSeconds: 1500     # discover's ceiling for a large cluster; cli is bounded well under this by its own pack.yaml output.maxTimeoutSeconds
  resources:
    cpuRequest: "100m"
    cpuLimit: "1"
    memoryRequest: "256Mi"
    memoryLimit: "1Gi"
  # A large cluster's discovery sweep keeps no bulk data resident on disk
  # (every item streams straight to papi via the sync protocol), but the
  # kubeconfig credential and its incidental temp files (credentials.py)
  # live under workdir for the life of one request -- 1Gi is comfortably
  # above anything that footprint needs.
  workSizeLimit: "1Gi"

# --- which subjects this capability applies to; ANY entry matching => applies ----------
appliesTo:
  - platform: kubernetes
    type: cluster

# --- what the platform must supply ----------------------------------------------------
needs:
  credentials:
    - name: kubeconfig             # the local name a task reads it by
      kind: k8s.kubeconfig         # platform-contract §4
      access: read
    - name: resourceSync           # the local name a task reads it by
      kind: runwhen.resourceSync   # platform-contract §4 -- lease-scoped, minted per run
      access: write

# --- runs once per request, before any task --------------------------------------------
setup:
  task: connect                    # materialise the kubeconfig, check access, read server version + kube-system UID
  inputs:
    context: { from: request, optional: true }  # same named kubeconfig context discover builds its own client from
  outputs:
    serverVersion: { type: string }
    clusterUid:    { type: string }

# --- the tasks themselves ---------------------------------------------------------------
tasks:
  - name: discover
    description: Enumerate, sanitize and push this cluster's resources to the platform's resource inventory
    readOnly: false
    inputs:
      clusterName:       { from: request }
      namespaces:        { from: request, optional: true }
      excludeNamespaces: { from: request, optional: true }
      configMapValues:   { from: request, optional: true }
      overlay:           { from: request, optional: true }
      context:           { from: request, optional: true }  # named kubeconfig context; defaults to current-context
    outputs:
      summary:
        kind: rw.discovery_summary.v1
        schema: ./schemas/discovery_summary.v1.json

  - name: cli
    description: Run one allow-listed, read-only kubectl command and return its output
    readOnly: true
    invocation: [sync]              # papi calls this synchronously from platform-cli/{name}:run (platform-contract §7); every other task keeps the default [queued]
    inputs:
      clusterName:    { from: request }
      argv:           { from: request }            # list[str] -- already validated by papi; re-validated here regardless
      maxBytes:       { from: request, optional: true }
      timeoutSeconds: { from: request, optional: true }
    outputs:
      result:
        kind: rw.cli_result.v1
        schema: ./schemas/cli_result.v1.json

retention:
  pod: on_failure                  # all | on_failure | none
  result: 30d
